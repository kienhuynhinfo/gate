<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Cổng Kiến Huỳnh</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#b5482b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kiến Huỳnh">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>html,body{margin:0;height:100%;background:#fff}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}#ld{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;font:15px system-ui,sans-serif;color:#b5482b}</style>
</head><body>
<div id="ld"><img src="/logo-h.png" alt="Kiến Huỳnh Design" height="96"><span>Đang mở Cổng Kiến Huỳnh…</span></div>
<iframe id="f" allow="clipboard-write; camera; microphone; geolocation"></iframe>
<script>
var U='https://script.google.com/macros/s/AKfycbwNvA1rt3I6Y78BLstJHYxnGGU4A-i_-RZkvKGXbLRmlK6qhGlPxLAYkDC-XfXgheaN/exec',t='',f=document.getElementById('f');
try{t=localStorage.getItem('kh_t')||''}catch(e){}
f.onload=function(){document.getElementById('ld').style.display='none'};
f.src=U+(t?'?k='+encodeURIComponent(t):'');
window.addEventListener('message',function(e){
 try{var h=new URL(e.origin).hostname;if(!/(\.googleusercontent\.com|\.google\.com)$/.test(h))return;
 var d=e.data;if(!d||typeof d!=='object'||!('kh_t' in d))return;
 if(d.kh_t&&/^[0-9a-zA-Z_-]{20,60}$/.test(d.kh_t))localStorage.setItem('kh_t',d.kh_t);else if(!d.kh_t)localStorage.removeItem('kh_t');}catch(x){}
});
</script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>window.OneSignalDeferred=window.OneSignalDeferred||[];OneSignalDeferred.push(async function(OneSignal){await OneSignal.init({appId:"85e0e6df-ef26-4895-9108-a253f0b1d7a3"});OneSignal.Notifications.addEventListener("foregroundWillDisplay",function(ev){try{ev.preventDefault();ev.notification.display();}catch(x){}});window.addEventListener("message",function(e){try{var h=new URL(e.origin).hostname;if(!/(\.googleusercontent\.com|\.google\.com)$/.test(h))return;var d=e.data;if(d&&typeof d==="object"&&typeof d.kh_email==="string"&&/^[^@\s]+@[^@\s]+$/.test(d.kh_email))OneSignal.login(d.kh_email.toLowerCase());}catch(x){}});});</script>
<script>
OneSignalDeferred.push(function(OneSignal){
var ios=/iphone|ipad|ipod/i.test(navigator.userAgent),sa=window.navigator.standalone||matchMedia('(display-mode: standalone)').matches;
var b=document.createElement('button');b.id='khbell';b.textContent='🔔 Bật thông báo';
b.style.cssText='position:fixed;left:12px;bottom:12px;z-index:99999;padding:9px 14px;border:0;border-radius:20px;background:#b5482b;color:#fff;font:600 14px system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.25);display:none';
document.body.appendChild(b);
function upd(){try{var ok=('Notification' in window)&&Notification.permission==='granted'&&OneSignal.User.PushSubscription.optedIn;b.style.display=ok?'none':'block';}catch(e){b.style.display='block';}}
b.onclick=function(){if(ios&&!sa){alert('Trên iPhone: bấm nút Chia sẻ của Safari, chọn Thêm vào Màn hình chính, rồi mở Cổng từ biểu tượng mới để bật thông báo.');return;}if(!('Notification' in window)){alert('Thiết bị này chưa hỗ trợ thông báo.');return;}if(Notification.permission==='denied'){alert('Thông báo đang bị chặn. Vào Cài đặt của trình duyệt hoặc ứng dụng, bật lại Thông báo cho Cổng Kiến Huỳnh.');return;}OneSignal.Notifications.requestPermission().then(function(){return OneSignal.User.PushSubscription.optIn();}).then(upd,upd);};
try{OneSignal.User.PushSubscription.addEventListener('change',upd);}catch(e){}
setTimeout(upd,2000);setTimeout(upd,6000);
});
</script>
</body></html>

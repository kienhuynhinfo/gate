<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Cổng Kiến Huỳnh</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#b5482b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kiến Huỳnh">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>html,body{margin:0;height:100%;background:#fff}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}#ld{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;font:15px system-ui,sans-serif;color:#b5482b}</style>
</head><body>
<div id="ld"><img src="/logo-h.png" alt="Kiến Huỳnh Design" height="96"><span>Đang mở Cổng Kiến Huỳnh…</span></div>
<iframe id="f" allow="clipboard-write; camera; microphone; geolocation"></iframe>
<script>
var U='https://script.google.com/macros/s/AKfycbwNvA1rt3I6Y78BLstJHYxnGGU4A-i_-RZkvKGXbLRmlK6qhGlPxLAYkDC-XfXgheaN/exec',t='',f=document.getElementById('f');
try{t=localStorage.getItem('kh_t')||''}catch(e){}
f.onload=function(){document.getElementById('ld').style.display='none'};
f.src=U+(t?'?k='+encodeURIComponent(t):'');
window.addEventListener('message',function(e){
 try{var h=new URL(e.origin).hostname;if(!/(\.googleusercontent\.com|\.google\.com)$/.test(h))return;
 var d=e.data;if(!d||typeof d!=='object'||!('kh_t' in d))return;
 if(d.kh_t&&/^[0-9a-zA-Z_-]{20,60}$/.test(d.kh_t))localStorage.setItem('kh_t',d.kh_t);else if(!d.kh_t)localStorage.removeItem('kh_t');}catch(x){}
});
</script>
</body></html>

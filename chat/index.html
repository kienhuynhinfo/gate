<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chat nội bộ</title>
<style>
:root{--c:#0F766E;--bg:#F5F5F4;--card:#fff;--tx:#1C1917;--mu:#78716C;--ln:#E7E5E4;--me:#DCFCE7}
@media (prefers-color-scheme:dark){:root{--bg:#1C1917;--card:#292524;--tx:#F5F5F4;--mu:#A8A29E;--ln:#44403C;--me:#14532D}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
#login{max-width:380px;margin:0 auto;padding:48px 16px}
#login h1{font-size:20px;margin:0 0 4px}
#login p{color:var(--mu);margin:0 0 16px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--card)}
button{border:0;border-radius:10px;padding:10px 16px;background:var(--c);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--mu);font-weight:500;padding:6px 8px}
.row{display:flex;gap:8px;margin-bottom:10px}
#msg1{color:var(--mu);font-size:13px;min-height:20px}
#app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto;background:var(--card);border-left:1px solid var(--ln);border-right:1px solid var(--ln)}
#top{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px) 12px;border-bottom:1px solid var(--ln);padding-top:max(10px,env(safe-area-inset-top))}
#top select{flex:1;min-width:0}
#top .dm{max-width:44%}
#title{font-weight:700;padding:8px 14px;border-bottom:1px solid var(--ln);color:var(--c)}
#list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.b{max-width:82%;padding:8px 12px;border-radius:14px;background:var(--bg);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.b.me{align-self:flex-end;background:var(--me)}
.b .h{font-size:11px;color:var(--mu);margin-bottom:2px}
#bar{display:flex;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--ln)}
#txt{resize:none;max-height:120px;border-radius:18px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#292524;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;max-width:90%}
</style>
</head>
<body>

<div id="login" hidden>
  <h1 id="ttl">Chat nội bộ</h1>
  <p>Nhập email đã đăng ký với công ty để nhận mã đăng nhập qua email.</p>
  <div class="row"><input id="em" type="email" inputmode="email" autocomplete="email" placeholder="email@congty.com"><button id="bSend">Gửi mã</button></div>
  <div id="step2" class="row" hidden><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Mã trong email"><button id="bVerify">Vào</button></div>
  <div id="msg1"></div>
</div>

<div id="app" hidden>
  <div id="top">
    <select id="kenh" aria-label="Chọn kênh"></select>
    <select id="dm" class="dm" aria-label="Nhắn riêng"></select>
    <button class="ghost" id="bOut">Thoát</button>
  </div>
  <div id="title"></div>
  <div id="list"></div>
  <div id="bar">
    <textarea id="txt" rows="1" placeholder="Nhập tin nhắn..."></textarea>
    <button id="bSendMsg">Gửi</button>
  </div>
</div>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ====== CẤU HÌNH: điền 2 dòng đầu từ Supabase > Project Settings > API ====== */
var CFG={
  url:'https://wxlqdibzqmdiyopmvyzg.supabase.co',
  key:'sb_publishable_l-PTvErUimNqO-lDwC1gaw_kVVx27l6',        /* khoá anon (công khai) - KHÔNG dùng service_role */
  title:'Chat nội bộ',
  color:'#0F766E',
  bot:'Trợ lý'
};

var sb=supabase.createClient(CFG.url,CFG.key);
var ME=null,MEMBERS=[],CUR=null,SEEN={},UNREAD={},CHAN=[],SUB=null;
function $(id){return document.getElementById(id);}
function show(w){$('login').hidden=(w!=='login');$('app').hidden=(w!=='app');}
function toast(t){var e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){e.hidden=true;},3500);}

async function init(){
  document.title=CFG.title;$('ttl').textContent=CFG.title;
  document.documentElement.style.setProperty('--c',CFG.color);
  var s=await sb.auth.getSession();
  if(s.data.session){await enter();}else{show('login');}
}
async function sendCode(){
  var email=$('em').value.trim().toLowerCase();if(!email)return;
  $('msg1').textContent='Đang gửi mã...';
  var r=await sb.auth.signInWithOtp({email:email,options:{shouldCreateUser:true}});
  if(r.error){$('msg1').textContent='Chưa gửi được mã: '+r.error.message;return;}
  $('msg1').textContent='Đã gửi mã tới '+email+'. Nhập mã vừa nhận.';$('step2').hidden=false;$('code').focus();
}
async function verify(){
  var email=$('em').value.trim().toLowerCase(),token=$('code').value.trim();if(!token)return;
  var r=await sb.auth.verifyOtp({email:email,token:token,type:'email'});
  if(r.error){$('msg1').textContent='Mã chưa đúng hoặc đã hết hạn.';return;}
  await enter();
}
async function enter(){
  var r=await sb.from('members').select('*').eq('active',true).order('name');
  var u=(await sb.auth.getUser()).data.user;
  var em=u&&u.email?u.email.toLowerCase():'';
  MEMBERS=r.data||[];
  ME=MEMBERS.filter(function(m){return m.email.toLowerCase()===em;})[0];
  if(r.error||!ME){
    await sb.auth.signOut();show('login');
    $('msg1').textContent='Email này chưa được đăng ký với công ty. Vui lòng đăng nhập bằng email đã đăng ký.';return;
  }
  show('app');buildChannels();subscribe();open(CHAN[0].k,CHAN[0].t);
}
function lead(){return ['GiamDoc','Leader','HanhChinh'].indexOf(ME.vai_tro)>=0;}
function buildChannels(){
  var L=[{k:'TB',t:'Thông báo công ty'},{k:'ALL',t:'Cả công ty'}];
  var ph=[];MEMBERS.forEach(function(m){if(m.phong&&ph.indexOf(m.phong)<0)ph.push(m.phong);});
  ph.forEach(function(p){if(lead()||p===ME.phong)L.push({k:'P:'+p,t:'Phòng '+p});});
  if(!/^PG/i.test(ME.chuc_danh||''))L.push({k:'EM:'+ME.email.toLowerCase(),t:'Chat với '+CFG.bot});
  CHAN=L;renderSelect();
  var d=$('dm');d.innerHTML='';var o=document.createElement('option');o.value='';o.textContent='Nhắn riêng...';d.appendChild(o);
  MEMBERS.forEach(function(m){if(m.email.toLowerCase()===ME.email.toLowerCase())return;var x=document.createElement('option');x.value=m.email.toLowerCase();x.textContent=m.name;d.appendChild(x);});
}
function renderSelect(){
  var s=$('kenh');s.innerHTML='';
  CHAN.forEach(function(c){var o=document.createElement('option');o.value=c.k;o.textContent=c.t+(UNREAD[c.k]?'  ('+UNREAD[c.k]+')':'');s.appendChild(o);});
  if(CUR&&CHAN.some(function(c){return c.k===CUR;}))s.value=CUR;
}
function dmKey(other){var a=[ME.email.toLowerCase(),other].sort();return 'D:'+a.join('|');}
async function open(k,t){
  CUR=k;SEEN={};UNREAD[k]=0;$('title').textContent=t;$('list').innerHTML='';renderSelect();
  var r=await sb.from('messages').select('*').eq('kenh',k).order('id',{ascending:false}).limit(100);
  if(r.error){toast('Không tải được tin: '+r.error.message);return;}
  (r.data||[]).reverse().forEach(add);scrollEnd();
}
function subscribe(){
  if(SUB)sb.removeChannel(SUB);
  /* nghe mọi tin mới; cơ sở dữ liệu tự lọc theo quyền của người dùng */
  SUB=sb.channel('chat-all').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},function(p){
    var m=p.new;
    if(m.kenh===CUR){add(m);scrollEnd();}
    else{UNREAD[m.kenh]=(UNREAD[m.kenh]||0)+1;renderSelect();}
  }).subscribe();
}
function add(m){
  if(SEEN[m.id])return;SEEN[m.id]=1;
  var mine=m.email===ME.email.toLowerCase();
  var d=document.createElement('div');d.className='b'+(mine?' me':'');
  var h=document.createElement('div');h.className='h';
  h.textContent=(mine?'':m.ten+' · ')+new Date(m.created_at).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});
  var t=document.createElement('div');t.textContent=m.noi_dung;   /* textContent: chống chèn mã độc */
  d.appendChild(h);d.appendChild(t);$('list').appendChild(d);
}
function scrollEnd(){var l=$('list');l.scrollTop=l.scrollHeight;}
async function sendMsg(){
  var t=$('txt').value.trim();if(!t||!CUR)return;$('txt').value='';
  var r=await sb.from('messages').insert({company_id:ME.company_id,kenh:CUR,noi_dung:t});
  if(r.error){$('txt').value=t;toast('Chưa gửi được: '+r.error.message);}
}
$('bSend').onclick=sendCode;
$('bVerify').onclick=verify;
$('code').onkeydown=function(e){if(e.key==='Enter')verify();};
$('em').onkeydown=function(e){if(e.key==='Enter')sendCode();};
$('kenh').onchange=function(){var c=CHAN.filter(function(x){return x.k===$('kenh').value;})[0];if(c)open(c.k,c.t);};
$('dm').onchange=function(){
  var v=$('dm').value;if(!v)return;
  var m=MEMBERS.filter(function(x){return x.email.toLowerCase()===v;})[0];
  var k=dmKey(v);if(!CHAN.some(function(c){return c.k===k;})){CHAN.push({k:k,t:'Riêng: '+m.name});}
  renderSelect();$('dm').value='';open(k,'Riêng: '+m.name);
};
$('bSendMsg').onclick=sendMsg;
$('txt').onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}};
$('bOut').onclick=async function(){if(SUB)sb.removeChannel(SUB);await sb.auth.signOut();ME=null;CUR=null;show('login');};
init();
</script>
</body>
</html>

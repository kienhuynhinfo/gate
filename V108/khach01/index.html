<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cổng Khách · Kiến Huỳnh</title>
<style>
:root{--bg:#F5F5F4;--card:#fff;--ink:#1C1917;--muted:#78716C;--line:#E7E5E4;--brand:#C2410C;--brand-d:#9A3412;--brand-l:#FFF1E8;--ok:#3f7d4e;--warn:#c78a12;--late:#b3342b}
@media (prefers-color-scheme:dark){:root{--bg:#1c1816;--card:#262120;--ink:#f1e9e2;--muted:#a89b90;--line:#3a322e;--brand:#e0794d;--brand-d:#f19a74;--brand-l:#3a2a22;--ok:#6fbf84;--warn:#e3b04b;--late:#ee7d73}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.hide{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px}
.brand{font-weight:700;letter-spacing:.04em;color:var(--brand);font-size:13px;text-transform:uppercase}
.lbox h1{font-size:22px;margin:6px 0 4px}
.lbox p{color:var(--muted);font-size:14px;margin-bottom:18px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
input,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus{outline:2px solid var(--brand);border-color:transparent}
.btn{padding:11px 18px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.btn.full{width:100%;margin-top:18px;padding:13px;font-size:16px}
.btn.ghost{background:var(--brand-l);color:var(--brand-d)}
.btn:disabled{opacity:.6}
.err{color:var(--late);font-size:13px;margin-top:10px;min-height:18px}
.ok{color:var(--ok);font-size:13px;margin-top:8px}
header{background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hrow .t{font-weight:700;font-size:17px}.hrow .s{color:var(--muted);font-size:13px}
.out{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs div{max-width:760px;margin:0 auto;display:flex;padding:6px 4px}
.tabs button{flex:1;min-width:0;border:0;background:none;padding:2px 0;color:var(--muted);font:inherit;font-size:10.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;white-space:nowrap}
.tabs button i{display:flex;align-items:center;justify-content:center;width:42px;height:28px;border-radius:14px;font-style:normal;transition:background .15s}
.tabs button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--brand);font-weight:700}
.tabs button.on i{background:var(--brand-l)}
body{padding-bottom:84px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.card h2{font-size:15px;margin-bottom:10px}
.big{font-size:30px;font-weight:700;color:var(--brand);line-height:1.15}
.muted{color:var(--muted);font-size:13px}
.bar{height:10px;background:var(--brand-l);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}.kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:right}
.item{padding:12px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.item .n{font-weight:600}
.item .m{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:13px;margin-top:3px;align-items:center}
.item a{color:var(--brand);text-decoration:none;font-weight:600}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--brand-l);color:var(--brand-d)}
.tag.ok{background:rgba(63,125,78,.15);color:var(--ok)}.tag.warn{background:rgba(199,138,18,.15);color:var(--warn)}.tag.late{background:rgba(179,52,43,.15);color:var(--late)}
.staff{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{background:var(--brand-l);color:var(--brand-d);border-radius:12px;padding:6px 11px;font-size:13px;line-height:1.3}
.chip b{display:block}
.frow{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}.frow>div{flex:1;min-width:130px}.frow .btn{flex:none}
.sub{font-size:12px;color:var(--muted);margin-top:8px}
.chip.ld{background:var(--brand);color:#fff}
.gl{font-size:12px;color:var(--muted);margin:10px 0 2px;font-weight:600}
.mini{font-size:12px;color:var(--muted);line-height:1.5;margin-top:4px}
details.sm summary{font-size:12px;color:var(--muted);cursor:pointer;list-style:none}
details.sm summary::after{content:" ▾"}
.seg{display:flex;gap:6px;margin-top:8px;background:var(--brand-l);padding:4px;border-radius:12px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font:inherit;font-size:14px;color:var(--brand-d);cursor:pointer}
.seg button.on{background:var(--card);font-weight:700}
.chat{display:flex;flex-direction:column;gap:8px;padding:8px 0 4px;max-height:38vh;overflow-y:auto}
.msg{max-width:86%;padding:9px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}.msg.me small{color:rgba(255,255,255,.75)}
.msg.them{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.bot{align-self:flex-start;background:var(--brand-l);border-bottom-left-radius:4px}
.msg b.who{display:block;font-size:12px;color:var(--brand-d);margin-bottom:2px}
.send{display:flex;gap:8px;margin-top:8px}.send input{flex:1}
.empty{color:var(--muted);text-align:center;padding:26px 8px;font-size:14px}
.note{background:var(--brand-l);color:var(--brand-d);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row2 .btn{width:100%}
.lib{padding:12px 0;border-top:1px solid var(--line)}.lib:first-child{border-top:0}.lib b{display:block}.lib p{color:var(--muted);font-size:14px;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer;background:var(--brand-l)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
</style>
</head>
<body>

<section id="login" class="login">
  <form class="lbox" id="lf" autocomplete="on">
    <div class="brand">Kiến Huỳnh Design</div>
    <h1>Cổng Khách hàng</h1>
    <p>Theo dõi tiến độ công trình và trao đổi trực tiếp với đội ngũ Kiến Huỳnh.</p>
    <label for="em">Email</label>
    <input id="em" name="username" type="text" inputmode="email" autocomplete="username" autocapitalize="none" required>
    <label for="pin">Mã PIN (4 số)</label>
    <input id="pin" name="password" type="password" inputmode="numeric" maxlength="4" pattern="\d{4}" autocomplete="current-password" required>
    <button class="btn full" id="lbt" type="submit">Đăng nhập</button>
    <div class="err" id="le"></div>
  </form>
</section>

<section id="app" class="hide">
  <header><div class="hrow">
    <div><div class="t" id="pn">Dự án</div><div class="s" id="ps"></div></div>
    <button class="out" id="lo">Thoát</button>
  </div></header>
  <div class="tabs"><div id="tabs">
    <button data-t="home" class="on" ><i><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></i>Tổng quan</button>
    <button data-t="design"><i><svg viewBox="0 0 24 24"><path d="M3 21l3-1 12-12-2-2L4 18zM14 6l2 2M3 21l1-3"/></svg></i>Thiết kế</button>
    <button data-t="build"><i><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg></i>Thi công</button>
    <button data-t="docs"><i><svg viewBox="0 0 24 24"><path d="M6 3h8l5 5v13H6zM14 3v5h5M9 13h7M9 17h7"/></svg></i>Hồ sơ</button>
    <button data-t="adv"><i><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg></i>Tư vấn</button>
    <button data-t="me"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></i>Cá nhân</button>
  </div></div>

  <main class="wrap">
    <div id="v-home">
      <div class="card" id="hc"></div>
      <div class="card"><h2>Thông tin dự án</h2><div id="info"></div></div>
      <div class="card"><h2>Việc sắp tới</h2><div id="next"></div></div>
      <div class="card"><h2>Tiến độ chung</h2><div id="ov"></div></div>
      <div class="card"><h2>Nhân sự phụ trách</h2><div class="staff" id="staffH"></div></div>
    </div>
    <div id="v-design" class="hide"><div class="card" id="dsum"></div><div id="dlist"></div></div>
    <div id="v-build" class="hide">
      <div class="card" id="bsum"></div>
      <div class="card" id="blist"></div>
      <div class="card"><h2>Nhật ký thi công</h2>
        <div class="frow"><div><label>Từ ngày</label><input type="date" id="df"></div><div><label>Đến ngày</label><input type="date" id="dt"></div><button class="btn ghost" id="dclr">Xoá lọc</button></div>
        <div class="muted" id="dcount" style="margin-top:6px"></div>
      </div>
      <div id="dl"></div>
    </div>
    <div id="v-docs" class="hide"><div id="dc"></div></div>
    <div id="v-me" class="hide">
      <div class="card"><h2>Thông tin cá nhân</h2>
        <label>Họ tên</label><input id="pf-n">
        <label>Email đăng nhập</label><input id="pf-e" disabled>
        <label>Số điện thoại</label><input id="pf-p" inputmode="tel">
        <label>Địa chỉ</label><input id="pf-a">
        <label>Ghi chú / mong muốn</label><textarea id="pf-t"></textarea>
        <button class="btn full" id="pf-s">Lưu thông tin</button><div class="ok" id="pf-m"></div>
      </div>
      <div class="card"><h2>Đổi mã PIN</h2>
        <label>PIN hiện tại</label><input id="pw-o" type="password" inputmode="numeric" maxlength="4">
        <label>PIN mới (4 số)</label><input id="pw-n" type="password" inputmode="numeric" maxlength="4">
        <button class="btn full" id="pw-s">Đổi PIN</button><div class="ok" id="pw-m"></div>
      </div>
    </div>
    <div id="v-adv" class="hide">
      <div class="card">
        <h2>Chat dự án</h2><details class="sm"><summary>Nhân sự trong nhóm</summary><div class="mini" id="staffC"></div></details>
        <div class="seg" id="seg"><button data-c="g" class="on">Nhóm dự án</button><button data-c="b">Hỏi trợ lý (riêng)</button></div>
        <div id="cg"></div><div id="cb" class="hide"></div>
      </div>
      <div class="card"><h2>Thư viện &amp; tư vấn</h2>
        <div class="row2"><button class="btn ghost" data-a="lib">Thư viện mẫu</button><button class="btn ghost" data-a="sug">Đề xuất</button></div>
        <div style="margin-top:10px"><button class="btn ghost" style="width:100%" data-a="how">Tư vấn thiết kế – thi công</button></div>
        <div id="advbody" style="margin-top:14px"></div>
        <button class="btn ghost" style="width:100%;margin-top:10px" id="askbot">Hỏi trợ lý về nội dung này</button>
      </div>
    </div>
  </main>
</section>
<div id="lb" class="hide"><img alt=""></div>

<script>
const _m=location.pathname.match(/\/([A-Za-z0-9-]+)\/(khach\d+)/i)||[];
const CODE=(_m[1]||"").toUpperCase(),SLUG=(_m[2]||"").toLowerCase();
const API="https://wxlqdibzqmdiyopmvyzg.supabase.co/functions/v1/client-portal";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let token=null,me="",D=null,boxes=[],timer=null;
try{token=localStorage.getItem("kh_tk_"+CODE+SLUG);me=localStorage.getItem("kh_em")||"";}catch(_){}
async function call(b){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,...b})});return r.json();}
const fmt=d=>{if(!d)return"—";const[y,m,x]=String(d).slice(0,10).split("-");return x+"/"+m+"/"+y;};
function stTag(p){const s=p.status||"";if(s==="Hoàn thành")return'<span class="tag ok">Hoàn thành</span>';if(/Cần đẩy/.test(s))return'<span class="tag late">'+esc(s)+"</span>";if(/chờ/i.test(s))return'<span class="tag warn">'+esc(s)+"</span>";return'<span class="tag">'+esc(s)+"</span>";}
const _n=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");
const _dep=s=>{const x=_n((s.title||"")+" "+(s.grp||""));return /kien truc|thiet ke/.test(x)?0:/ket cau|thi cong|xay dung/.test(x)?1:/noi that/.test(x)?2:/hanh chinh/.test(x)?3:4;};
const _tt=s=>{const t=s.title||s.grp||"";return /xay dung/.test(_n(t))&&!/hanh chinh/.test(_n(t))?t+" (phụ trách kết cấu)":t;};
const _lead=s=>/truong phong|leader|giam doc|quan ly/.test(_n(s.title));
const sortStaff=st=>(st||[]).slice().sort((a,b)=>(_lead(b)-_lead(a))||(_dep(a)-_dep(b))||String(a.name).localeCompare(String(b.name),"vi"));
const chips=st=>{st=sortStaff(st);if(!st.length)return'<div class="muted">Đang cập nhật nhân sự phụ trách.</div>';
  const one=s=>'<div class="chip'+(_lead(s)?' ld':'')+'"><b>'+esc(s.name)+"</b>"+esc(_tt(s))+"</div>";
  const L=st.filter(_lead),O=st.filter(s=>!_lead(s));
  return (L.length?'<div class="gl">Trưởng phòng / Leader</div><div class="staff">'+L.map(one).join("")+"</div>":"")+(O.length?'<div class="gl">Nhân sự phụ trách</div><div class="staff">'+O.map(one).join("")+"</div>":"");};
const mini=st=>{st=sortStaff(st);return st.length?st.map(s=>esc(s.name)+" ("+esc(_tt(s).replace(/^Trưởng phòng /,"TP "))+")").join(" · "):"Đang cập nhật";};

/* Chat box dung chung (nhom / rieng) */
function ChatBox(host,ch,rows,hint){
  const box={ch,last:0};
  host.innerHTML='<div class="chat"></div><div class="send"><input maxlength="2000" placeholder="'+esc(hint)+'"><button class="btn">Gửi</button></div>';
  const list=$(".chat",host),inp=$("input",host),bt=$("button",host);
  box.add=(arr,reset)=>{
    if(reset){list.innerHTML="";box.last=0;}
    arr.forEach(m=>{if(m.n<=box.last)return;box.last=m.n;
      const isBot=m.email==="kh-bot"||m.email==="em",mine=(m.email||"").toLowerCase()===me.toLowerCase();
      const el=document.createElement("div");el.className="msg "+(isBot?"bot":mine?"me":"them");
      el.innerHTML=(mine?"":'<b class="who">'+esc(m.ten)+"</b>")+esc(m.noi_dung)+"<small>"+esc(String(m.ngay||"").slice(0,16))+"</small>";list.appendChild(el);});
    if(!list.children.length)list.innerHTML='<div class="empty">Chưa có tin nhắn. Anh/chị cứ đặt câu hỏi, đội ngũ Kiến Huỳnh sẽ phản hồi sớm nhất.</div>';
    else if(list.firstChild.className==="empty")list.firstChild.remove();
    list.scrollTop=list.scrollHeight;};
  const send=async()=>{const v=inp.value.trim();if(!v)return;inp.value="";bt.disabled=true;
    const r=await call({a:"send",ch,text:v});bt.disabled=false;
    if(r.ok){boxes.forEach(b=>b.ch===ch&&b.add(r.msgs,false));}else alert(r.msg||"Gửi chưa được");};
  bt.onclick=send;inp.addEventListener("keydown",e=>{if(e.key==="Enter")send();});
  box.add(rows||[],true);boxes.push(box);return box;
}
function render(d){
  D=d;me=d.email||me;const P=d.project,s=d.site,prog=d.progress||[];
  $("#pn").textContent=P.name||P.code;$("#ps").textContent=P.code+" · Xin chào "+(d.profile.name||"");
  const done=prog.filter(p=>p.status==="Hoàn thành").length;
  const pct=s&&s.percent_done!=null?Number(s.percent_done):prog.length?Math.round(done/prog.length*100):0;
  $("#hc").innerHTML='<div class="muted">Giai đoạn hiện tại</div><div class="big">'+esc(s&&s.phase?s.phase:"Đang triển khai")+'</div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,pct))+'%"></i></div><div class="muted">'+done+"/"+prog.length+" hạng mục hoàn thành · "+pct+"%"+(s&&s.condition?" · "+esc(s.condition):"")+"</div>";
  const kv=[["Mã dự án",P.code]];
  (d.areas||[]).forEach(a=>kv.push([a.item||"Hạng mục",(a.floor_area?Number(a.floor_area).toLocaleString("vi-VN")+" m²":"—")+(a.floors?" · "+a.floors+" tầng":"")]));
  if(s&&s.updated_at)kv.push(["Cập nhật gần nhất",fmt(s.updated_at)]);
  kv.push(["Hồ sơ thiết kế",(d.docs||[]).length+" tài liệu"]);
  $("#info").innerHTML=kv.map(x=>'<div class="kv"><span>'+esc(x[0])+"</span><span>"+esc(x[1])+"</span></div>").join("");
  const nx=prog.filter(p=>p.status!=="Hoàn thành").sort((a,b)=>(a.due_date||"9").localeCompare(b.due_date||"9")).slice(0,4);
  $("#next").innerHTML=nx.length?nx.map(p=>'<div class="item"><div class="n">'+esc(p.item)+'</div><div class="m">'+stTag(p)+(p.due_date?"<span>Hạn: "+fmt(p.due_date)+"</span>":"")+"</div></div>").join(""):'<div class="empty">Các hạng mục đã hoàn thành.</div>';
  $("#staffH").innerHTML=chips(d.staff);$("#staffC").innerHTML=mini(d.staff);
  // phan loai tien do: thi cong = Xay dung / Thi cong; con lai = thiet ke (gom ca bao gia)
  const isB=p=>/xây dựng|thi công/i.test(p.discipline||"");
  const pB=prog.filter(isB),pD=prog.filter(p=>!isB(p));
  const dn=a=>a.filter(p=>p.status==="Hoàn thành").length,pc=a=>a.length?Math.round(dn(a)/a.length*100):0;
  const prow=p=>'<div class="item"><div class="n">'+esc(p.item)+'</div><div class="m">'+stTag(p)+(p.due_date?"<span>Hạn: "+fmt(p.due_date)+"</span>":"")+(p.done_date?"<span>Xong: "+fmt(p.done_date)+"</span>":"")+"</div></div>";
  $("#ov").innerHTML='<div class="kv"><span>Thiết kế</span><span>'+dn(pD)+"/"+pD.length+' hạng mục</span></div><div class="bar"><i style="width:'+pc(pD)+'%"></i></div><div class="kv"><span>Thi công</span><span>'+(s&&s.phase?esc(s.phase):"Chưa bắt đầu")+(s&&s.percent_done!=null?" · "+Number(s.percent_done)+"%":"")+'</span></div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,s&&s.percent_done!=null?Number(s.percent_done):pc(pB)))+'%"></i></div>';
  // tab Thiet ke
  const grp={};pD.forEach(p=>(grp[p.discipline||"Khác"]=grp[p.discipline||"Khác"]||[]).push(p));
  $("#dsum").innerHTML='<h2>Tiến độ thiết kế</h2><div class="big">'+pc(pD)+'%</div><div class="bar"><i style="width:'+pc(pD)+'%"></i></div><div class="muted">'+dn(pD)+"/"+pD.length+' hạng mục hoàn thành</div><div class="sub">Dữ liệu cập nhật trực tiếp từ hệ thống quản lý dự án của Kiến Huỳnh.</div>';
  $("#dlist").innerHTML=Object.keys(grp).length?Object.keys(grp).map(k=>'<div class="card"><h2>'+esc(k)+"</h2>"+grp[k].map(prow).join("")+"</div>").join(""):'<div class="card"><div class="empty">Chưa có hạng mục thiết kế nào được cập nhật.</div></div>';
  // tab Thi cong
  $("#bsum").innerHTML='<h2>Tiến độ thi công</h2>'+(s?'<div class="big">'+esc(s.phase||"Đang triển khai")+'</div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,Number(s.percent_done||0)))+'%"></i></div><div class="muted">Hoàn thành khoảng '+Number(s.percent_done||0)+'%'+(s.updated_at?" · cập nhật "+fmt(s.updated_at):"")+"</div>"+(s.condition?'<div class="sub">'+esc(s.condition)+"</div>":""):'<div class="empty">Dự án chưa bước vào thi công.</div>')+'<div class="sub">Dữ liệu cập nhật trực tiếp từ hệ thống quản lý dự án của Kiến Huỳnh.</div>';
  $("#blist").innerHTML=pB.length?"<h2>Hạng mục thi công</h2>"+pB.map(prow).join(""):"";
  $("#blist").classList.toggle("hide",!pB.length);
  // nhat ky thi cong (loc theo ngay)
  DIARY=(d.diary||[]);renderDiary();
  // ho so
  const kinds={};(d.docs||[]).forEach(x=>(kinds[x.kind]=kinds[x.kind]||[]).push(x));
  const ord=["Hồ sơ thiết kế","Tiến độ","Nhật ký thi công","Biên bản họp"];const ks=Object.keys(kinds).sort((a,b)=>{const x=ord.indexOf(a),y=ord.indexOf(b);return (x<0?9:x)-(y<0?9:y);});
  $("#dc").innerHTML=ks.length?ks.map(k=>'<div class="card"><h2>'+esc(k)+"</h2>"+kinds[k].map(x=>'<div class="item"><div class="n">'+esc(x.title)+'</div><div class="m"><span>'+fmt(x.doc_date)+"</span>"+(x.url?'<a href="'+esc(x.url)+'" target="_blank" rel="noopener">Mở xem</a>':'<span class="tag warn">Đang cấp quyền xem</span>')+"</div></div>").join("")+"</div>").join(""):'<div class="card"><div class="empty">Hồ sơ thiết kế đã chốt và biên bản họp sẽ được đăng tại đây.</div></div>';
  // ca nhan
  const pf=d.profile||{};$("#pf-n").value=pf.name||"";$("#pf-e").value=pf.email||me;$("#pf-p").value=pf.phone||"";$("#pf-a").value=pf.address||"";$("#pf-t").value=pf.note_kh||"";
  // chat
  boxes=[];
  ChatBox($("#cg"),"g",d.chatG,"Nhắn cho nhóm dự án… (gõ @bot để hỏi trợ lý)");
  ChatBox($("#cb"),"b",d.chatB,"Hỏi riêng trợ lý… (chỉ trợ lý và team phụ trách xem)");
}
const gid=u=>{const m=String(u||"").match(/[-\w]{25,}/);return m?m[0]:"";};
const thumb=p=>p.thumb||(p.id||gid(p.url)?"https://drive.google.com/thumbnail?id="+(p.id||gid(p.url))+"&sz=w600":p.url);
const full=p=>p.full||(p.id||gid(p.url)?"https://drive.google.com/thumbnail?id="+(p.id||gid(p.url))+"&sz=w1600":p.url);
document.addEventListener("click",e=>{const i=e.target.closest(".grid img");if(i){$("#lb img").src=i.dataset.full;$("#lb").classList.remove("hide");}else if(e.target.closest("#lb"))$("#lb").classList.add("hide");});

async function enter(){
  const d=await call({a:"home"});
  if(!d.ok){token=null;try{localStorage.removeItem("kh_tk_"+CODE+SLUG);}catch(_){}$("#login").classList.remove("hide");$("#app").classList.add("hide");return false;}
  $("#login").classList.add("hide");$("#app").classList.remove("hide");render(d);
  clearInterval(timer);
  timer=setInterval(async()=>{if(document.hidden)return;
    for(const ch of["g","b"]){const mx=Math.max(0,...boxes.filter(b=>b.ch===ch).map(b=>b.last));
      const r=await call({a:"chat",ch,after:mx});if(r.ok&&r.chat.length)boxes.filter(b=>b.ch===ch).forEach(b=>b.add(r.chat,false));}},6000);
  return true;
}
$("#lf").addEventListener("submit",async e=>{e.preventDefault();$("#le").textContent="";$("#lbt").disabled=true;
  try{const r=await call({a:"login",code:CODE,slug:SLUG,email:$("#em").value.trim(),pin:$("#pin").value.trim()});
    if(!r.ok){$("#le").textContent=r.msg||"Không đăng nhập được";return;}
    token=r.token;me=$("#em").value.trim();try{localStorage.setItem("kh_tk_"+CODE+SLUG,token);localStorage.setItem("kh_em",me);}catch(_){}
    await enter();}catch(_){$("#le").textContent="Không kết nối được, vui lòng thử lại";}finally{$("#lbt").disabled=false;}});
$("#lo").onclick=()=>{try{localStorage.removeItem("kh_tk_"+CODE+SLUG);}catch(_){}location.reload();};
let DIARY=[];
function renderDiary(){const f=$("#df").value,t=$("#dt").value;
  const list=DIARY.filter(e=>{const x=String(e.day||"").slice(0,10);return (!f||x>=f)&&(!t||x<=t);});
  $("#dcount").textContent=DIARY.length?(list.length+"/"+DIARY.length+" ngày nhật ký"):"";
  $("#dl").innerHTML=list.length?list.map(e=>'<div class="card"><h2>'+fmt(e.day)+(e.title?" · "+esc(e.title):"")+'</h2><div>'+esc(e.summary||"")+'</div><div class="grid">'+(e.photos||[]).map(p=>'<img loading="lazy" src="'+esc(thumb(p))+'" data-full="'+esc(full(p))+'" alt="'+esc(p.caption||"")+'">').join("")+"</div></div>").join(""):'<div class="card"><div class="empty">'+(DIARY.length?"Không có nhật ký trong khoảng ngày đã chọn.":"Dự án chưa bước vào thi công nên chưa có nhật ký. Khi thi công, nhật ký hằng ngày (ảnh, clip, đánh giá) sẽ hiện tại đây và khớp với tiến độ dự án.")+"</div></div>";}
$("#df").onchange=$("#dt").onchange=renderDiary;
$("#dclr").onclick=()=>{$("#df").value="";$("#dt").value="";renderDiary();};
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  ["home","design","build","docs","adv","me"].forEach(t=>$("#v-"+t).classList.toggle("hide",t!==b.dataset.t));window.scrollTo(0,0);};
$("#askbot").onclick=()=>{$("#seg button[data-c=b]").click();$("#cb").scrollIntoView({behavior:"smooth",block:"center"});const i=$("#cb input");i&&i.focus();};
$("#seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#seg button").forEach(x=>x.classList.toggle("on",x===b));
  $("#cg").classList.toggle("hide",b.dataset.c!=="g");$("#cb").classList.toggle("hide",b.dataset.c!=="b");};
$("#pf-s").onclick=async()=>{const r=await call({a:"profile",name:$("#pf-n").value,phone:$("#pf-p").value,address:$("#pf-a").value,note:$("#pf-t").value});$("#pf-m").textContent=r.ok?"Đã lưu thông tin.":(r.msg||"Chưa lưu được");};
$("#pw-s").onclick=async()=>{const r=await call({a:"pin",old:$("#pw-o").value,new:$("#pw-n").value});$("#pw-m").textContent=r.ok?"Đã đổi PIN. Lần sau đăng nhập bằng PIN mới.":(r.msg||"Chưa đổi được");if(r.ok){$("#pw-o").value="";$("#pw-n").value="";}};
/* Tu van */
const libHtml=items=>items.length?items.map(i=>'<div class="lib"><b>'+esc(i.title)+'</b><p>'+esc(i.summary||"")+"</p></div>").join(""):'<div class="empty">Chưa có nội dung phù hợp. Anh/chị hỏi trợ lý bên dưới để được hỗ trợ.</div>';
document.querySelector("#v-adv").addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;
  const body=$("#advbody"),a=b.dataset.a;body.innerHTML='<div class="muted">Đang tải…</div>';
  if(a==="lib"){body.innerHTML='<input id="lq" placeholder="Tìm mẫu, phong cách…"><div id="lr" style="margin-top:8px"></div>';
    const run=async()=>{const r=await call({a:"lib",q:$("#lq").value});$("#lr").innerHTML=libHtml(r.items||[]);};$("#lq").oninput=()=>{clearTimeout(window._lt);window._lt=setTimeout(run,300);};run();}
  else if(a==="sug"){const q=((D.site&&D.site.site_name)||D.project.name||"")+" "+((D.areas||[]).map(x=>x.item).join(" "));
    const r=await call({a:"lib",q});body.innerHTML="<b>Gợi ý phù hợp với dự án của anh/chị</b>"+libHtml((r.items||[]).slice(0,4))+'<div class="note">Muốn đề xuất chi tiết hơn, anh/chị nhắn trợ lý bên dưới hoặc nhờ kiến trúc sư phụ trách tư vấn.</div>';}
  else{const r=await call({a:"lib",kind:"thiet-ke"}),r2=await call({a:"lib",kind:"thi-cong"});
    body.innerHTML="<b>Thiết kế</b>"+libHtml(r.items||[])+"<b>Thi công</b>"+libHtml(r2.items||[]);}});
if(token)enter();
</script>
</body>
</html>
